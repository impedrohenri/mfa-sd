version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis_mfa
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379